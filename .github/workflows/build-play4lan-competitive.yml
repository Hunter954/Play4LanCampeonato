name: Build PLAY4LAN Competitive

on:
  workflow_dispatch:
  push:
    branches:
      - play4lan-competitive-build
    paths:
      - "PLAY4LANCompetitive/**"
      - ".github/workflows/build-play4lan-competitive.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PLAY4LAN
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Baixar motor base MatchZy 0.8.15
        run: |
          git clone https://github.com/shobhit-pathak/MatchZy.git upstream
          cd upstream
          git checkout ef289d512766b89b0f7bf3088208ae88235e61fa

      - name: Aplicar regras e identidade PLAY4LAN
        run: |
          python PLAY4LANCompetitive/build_transform.py
          python PLAY4LANCompetitive/build_fix.py
          python PLAY4LANCompetitive/build_fix2.py
          python PLAY4LANCompetitive/build_ready_v102.py
          python PLAY4LANCompetitive/build_ready_v103.py

      - name: Compilar PLAY4LAN Competitive
        run: |
          dotnet restore upstream/MatchZy.csproj
          dotnet publish upstream/MatchZy.csproj -c Release -o artifact/addons/counterstrikesharp/plugins/PLAY4LANCompetitive

      - name: Adicionar configurações PLAY4LAN
        run: |
          mkdir -p artifact/cfg
          cp -r upstream/cfg/PLAY4LAN artifact/cfg/PLAY4LAN
          cat > artifact/INSTALAR_PLAY4LAN.txt <<'EOF'
          PLAY4LAN COMPETITIVE 1.0.3

          1. PARE O SERVER 01.
          2. SUBSTITUA A PASTA:
             game\csgo\addons\counterstrikesharp\plugins\PLAY4LANCompetitive
          3. EXTRAIA O CONTEUDO DESTE PACOTE DIRETAMENTE EM:
             C:\CS2Platform\runtime\server01\game\csgo\
          4. INICIE O SERVER 01.
          5. NO CONSOLE DIGITE:
             css_plugins list

          Deve aparecer: PLAY4LAN Competitive 1.0.3 by PLAY4LAN

          ALTERACOES 1.0.3:
          - remove spam antigo de minimumReadyRequired
          - .pronto mostra somente o status da equipe do jogador
          - .status/.prontos mostra somente a equipe do jogador
          - depois de .pronto o jogador fica travado no lado escolhido
          - .naopronto libera a troca de lado
          - round faca continua exigindo 5/5 x 5/5
          EOF

      - name: Verificar pacote
        run: |
          test -f artifact/addons/counterstrikesharp/plugins/PLAY4LANCompetitive/PLAY4LANCompetitive.dll
          grep -R 'ModuleVersion => "1.0.3"' upstream/MatchZy.cs
          grep -R "play4lanReadyLockedTeam" upstream/MatchZy.cs
          grep -R "PrintPlay4LanTeamReadyBoard" upstream/Play4LanReadyVisual.cs
          grep -R "mensagens antigas de minimumReadyRequired desativadas" upstream/Utility.cs

      - name: Enviar pacote compilado
        uses: actions/upload-artifact@v4
        with:
          name: PLAY4LANCompetitive-v1.0.3-SERVER01
          path: artifact
          if-no-files-found: error
          retention-days: 30
