name: Build PLAY4LAN Competitive

on:
  workflow_dispatch:
  push:
    branches:
      - play4lan-competitive-build
    paths:
      - "PLAY4LANCompetitive/**"
      - ".github/workflows/build-play4lan-competitive.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PLAY4LAN
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Baixar motor base MatchZy 0.8.15
        run: |
          git clone https://github.com/shobhit-pathak/MatchZy.git upstream
          cd upstream
          git checkout ef289d512766b89b0f7bf3088208ae88235e61fa

      - name: Aplicar regras e identidade PLAY4LAN
        run: python PLAY4LANCompetitive/build_transform.py

      - name: Compilar PLAY4LAN Competitive
        run: |
          dotnet restore upstream/MatchZy.csproj
          dotnet publish upstream/MatchZy.csproj -c Release -o artifact/addons/counterstrikesharp/plugins/PLAY4LANCompetitive

      - name: Adicionar configurações PLAY4LAN
        run: |
          mkdir -p artifact/cfg
          cp -r upstream/cfg/PLAY4LAN artifact/cfg/PLAY4LAN
          cat > artifact/INSTALAR_PLAY4LAN.txt <<'EOF'
          PLAY4LAN COMPETITIVE 1.0.1

          1. PARE O SERVER 01.
          2. APAGUE/RENOMEIE:
             game\csgo\addons\counterstrikesharp\plugins\MatchZy
          3. EXTRAIA O CONTEUDO DESTE PACOTE DIRETAMENTE EM:
             C:\CS2Platform\runtime\server01\game\csgo\
          4. INICIE O SERVER 01.
          5. NO CONSOLE DIGITE:
             css_plugins list

          Deve aparecer: PLAY4LAN Competitive 1.0.1 by PLAY4LAN

          Comandos oficiais:
          .pronto .naopronto .faca .ficar .trocar .pause .tac .tec .voltar .placar .pausas .comandos
          EOF

      - name: Verificar pacote
        run: |
          test -f artifact/addons/counterstrikesharp/plugins/PLAY4LANCompetitive/PLAY4LANCompetitive.dll
          grep -R "PLAY4LAN Competitive" upstream/MatchZy.cs
          grep -R "css_pronto" upstream/ConsoleCommands.cs
          grep -R "css_pause" upstream/Play4LanCommands.cs
          grep -R "css_tac" upstream/Play4LanCommands.cs

      - name: Enviar pacote compilado
        uses: actions/upload-artifact@v4
        with:
          name: PLAY4LANCompetitive-v1.0.1-SERVER01
          path: artifact
          if-no-files-found: error
          retention-days: 30
