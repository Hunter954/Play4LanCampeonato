{% extends 'base.html' %}{% block content %}<div class="panel narrow"><h1>Meu perfil</h1>{% if current_user.steam_avatar %}<img class="avatar" src="{{current_user.avatar_url or current_user.steam_avatar}}">{% endif %}<p>SteamID64: <code>{{current_user.steam_id64 or 'Conta administrativa'}}</code></p><form method="post"><label>Nome real<input name="real_name" value="{{current_user.real_name or ''}}"></label><label>Nickname<input name="nickname" value="{{current_user.nickname or ''}}" required></label><label>Avatar personalizado (URL)<input name="avatar_url" value="{{current_user.avatar_url or ''}}"></label><button>Salvar</button></form><a class="button secondary" href="/teams/create">Criar time</a></div>{% endblock %}
