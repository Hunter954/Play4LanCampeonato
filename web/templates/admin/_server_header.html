<div class="server-topbar" id="server-admin" data-server-code="{{ server.code }}"><div><a href="{{ url_for('admin.dashboard') }}" class="back-link"><i class="bi bi-arrow-left"></i> Central</a><div class="server-title-line"><span class="server-icon large"><i class="bi bi-server"></i></span><div><span class="eyebrow">{{ server.code }}</span><h1>{{ server.display_name or server.code }}</h1></div></div></div><div class="server-top-status"><span class="phase-pill" data-role="phase">{{ telemetry.get('phase','AGUARDANDO') }}</span><span class="status-badge large {{ server.status|lower }}" data-role="server-status"><span></span>{{ server.status }}</span></div></div>
<nav class="server-tabs">
<a class="{{ 'active' if request.endpoint=='admin.server_detail' else '' }}" href="{{ url_for('admin.server_detail',code=server.code) }}"><i class="bi bi-speedometer2"></i> Visão geral</a>
<a class="{{ 'active' if request.endpoint=='admin.server_players' else '' }}" href="{{ url_for('admin.server_players',code=server.code) }}"><i class="bi bi-people-fill"></i> Jogadores</a>
<a class="{{ 'active' if request.endpoint=='admin.server_match' else '' }}" href="{{ url_for('admin.server_match',code=server.code) }}"><i class="bi bi-controller"></i> Partida</a>
<a class="{{ 'active' if request.endpoint=='admin.server_chat' else '' }}" href="{{ url_for('admin.server_chat',code=server.code) }}"><i class="bi bi-chat-left-text-fill"></i> Chat</a>
<a class="{{ 'active' if request.endpoint=='admin.server_backups' else '' }}" href="{{ url_for('admin.server_backups',code=server.code) }}"><i class="bi bi-clock-history"></i> Backups</a>
<a class="{{ 'active' if request.endpoint=='admin.server_logs' else '' }}" href="{{ url_for('admin.server_logs',code=server.code) }}"><i class="bi bi-journal-text"></i> Logs</a>
<a class="{{ 'active' if request.endpoint=='admin.server_security' else '' }}" href="{{ url_for('admin.server_security',code=server.code) }}"><i class="bi bi-shield-lock-fill"></i> Segurança</a>
</nav>
