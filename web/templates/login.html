{% extends 'site_base.html' %}
{% block title %}Acesso da organização · PLAY4LAN{% endblock %}
{% block content %}
<div class="auth-card">
  <span class="logo-mark big"><i class="bi bi-shield-lock"></i></span>
  <h1>Acesso da organização</h1>
  <p class="muted">Entre com o e-mail e a senha de administrador.</p>
  <form method="post" class="form">
    <label class="field"><span>E-mail</span><input name="email" type="email" required autocomplete="username"></label>
    <label class="field"><span>Senha</span><input name="password" type="password" required autocomplete="current-password"></label>
    <button class="btn btn-primary btn-lg btn-block" type="submit"><i class="bi bi-box-arrow-in-right"></i> Entrar</button>
  </form>
  <p class="muted small">Contas Steam marcadas como admin também acessam o painel pelo botão "Entrar com Steam".</p>
</div>
{% endblock %}
